name: Auth server CI

on:
  push:
    branches:
      - main
    paths:
      - "auth-server/**"
      - ".github/workflows/auth-server-ci.yml"
      - ".github/workflows/auth-server-publish.yml"

permissions:
  contents: read

concurrency:
  group: auth-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and validate container
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: auth-server
        run: npm ci

      - name: Run tests
        working-directory: auth-server
        run: npm test

      - name: Validate container build
        working-directory: auth-server
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            --tag "sync-drive-auth:ci-${GITHUB_SHA}" \
            .
