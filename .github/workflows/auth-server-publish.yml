name: Publish auth server image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: auth-server-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/dskritzinger/sync-drive-auth
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Images may only be published from main."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: auth-server
        run: npm ci

      - name: Run tests
        working-directory: auth-server
        run: npm test

      - name: Build image
        working-directory: auth-server
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Publish image
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Published \`${IMAGE_NAME}:${IMAGE_TAG}\`" \
            >> "${GITHUB_STEP_SUMMARY}"
